<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>iOS 18 Band App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body, html { 
      width: 100%; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif; 
      background: #000; color: #fff; overflow: hidden; 
    }
    
    #app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100%;
      margin: 0 auto;
      background: url('photo1.jpg') center/cover no-repeat;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 999;
      letter-spacing: -0.3px;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease;
      background: #000;
      z-index: 10;
    }

    .screen.home {
      background: transparent;
      padding: 44px 20px 20px 20px;
      z-index: 1;
    }

    .screen.hidden {
      transform: scale(0.92);
      opacity: 0;
      pointer-events: none;
    }

    /* Widgets Container */
    .widgets-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .widget {
      background: rgba(30, 30, 30, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 22px;
      padding: 14px 16px;
      height: 142px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
    }

    .widget-calendar .day { color: #ff3b30; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .widget-calendar .date-num { font-size: 36px; font-weight: 300; line-height: 1.1; margin-top: 2px; }
    .widget-calendar .event-box { background: rgba(255,255,255,0.12); padding: 8px 10px; border-radius: 12px; }
    .widget-calendar .event-title { font-size: 12px; font-weight: 600; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
    .widget-calendar .event-time { font-size: 11px; color: rgba(255,255,255,0.6); }

    .widget-photo {
      padding: 0;
      overflow: hidden;
      background: url('photo1.jpg') center/cover;
      cursor: pointer;
      position: relative;
    }
    .widget-photo-overlay {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      padding: 12px 12px 10px 12px;
    }
    .widget-photo-title { font-size: 12px; font-weight: 600; color: #fff; }
    .widget-photo-sub { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 1px; }

    /* iOS Pure App Icons Vector */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px 16px;
    }

    .app-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
    }

    .icon-box {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      position: relative;
    }

    .icon-box svg { width: 34px; height: 34px; fill: currentColor; }

    .badge {
      position: absolute;
      top: -4px; right: -4px;
      background: #ff3b30;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      border: 2px solid #000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    /* iOS Official Icon Styling */
    .bg-memo { background: linear-gradient(180deg, #ffe066 0%, #ffd000 100%); color: #1c1c1e; }
    .bg-settings { background: linear-gradient(180deg, #a2a2a7 0%, #636366 100%); color: #fff; }
    .bg-camera { background: linear-gradient(180deg, #99999e 0%, #7c7c80 100%); color: #fff; }
    .bg-album { background: #fff; }
    
    .bg-appstore { background: linear-gradient(180deg, #2b88ff 0%, #0062e6 100%); color: #fff; }
    .bg-spotify { background: #1ed760; color: #000; }
    .bg-youtube { background: #ff0000; color: #fff; }
    .bg-insta { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); color: #fff; }
    
    .bg-phone { background: linear-gradient(180deg, #53e070 0%, #28cd41 100%); color: #fff; }
    .bg-safari { background: #fff; color: #007aff; }
    .bg-kakao { background: #fee500; color: #191919; }
    .bg-messages { background: linear-gradient(180deg, #53e070 0%, #28cd41 100%); color: #fff; }

    /* Dock Bar */
    .dock {
      position: absolute;
      bottom: 22px;
      left: 16px; right: 16px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 32px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-around;
      border: 0.5px solid rgba(255, 255, 255, 0.2);
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 3px;
      z-index: 9999;
      cursor: pointer;
    }

    /* Nav Bar */
    .nav-bar {
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.15);
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(20px);
      margin-top: 30px;
    }
    .nav-title { font-size: 17px; font-weight: 600; }
    .back-btn { color: #0a84ff; font-size: 16px; cursor: pointer; display: flex; align-items: center; font-weight: 400; }

    /* Photos App Grid */
    .photos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 2px;
      overflow-y: auto;
      flex: 1;
      background: #000;
    }
    .photo-item {
      aspect-ratio: 1;
      background-size: cover;
      background-position: center;
      cursor: pointer;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 10000;
      display: none;
      justify-content: center;
      align-items: center;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 80%; border-radius: 8px; object-fit: contain; }
    .lightbox-arrow {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      color: white; font-size: 30px; padding: 16px; cursor: pointer;
    }
    .arrow-left { left: 10px; }
    .arrow-right { right: 10px; }

    /* Phone App List */
    .recents-list { overflow-y: auto; flex: 1; background: #000; }
    .date-section { padding: 12px 16px 6px; font-size: 13px; color: #8e8e93; font-weight: 600; background: #1c1c1e; }
    .call-item {
      padding: 12px 16px;
      border-bottom: 0.5px solid #2c2c2e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .call-name { font-size: 16px; font-weight: 500; color: #fff; }
    .call-name.missed { color: #ff453a; }
    .call-sub { font-size: 12px; color: #8e8e93; margin-top: 2px; }
    .call-time { font-size: 13px; color: #8e8e93; }

    /* Messages App List */
    .msg-list { overflow-y: auto; flex: 1; background: #000; }
    .msg-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 0.5px solid #2c2c2e;
      cursor: pointer;
    }
    .blue-dot { width: 10px; height: 10px; background: #0a84ff; border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #3a3a3c; display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 18px; margin-right: 12px; flex-shrink: 0; color: #fff; }
    .msg-content { flex: 1; overflow: hidden; }
    .msg-header { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .msg-author { font-size: 16px; font-weight: 600; color: #fff; }
    .msg-preview { font-size: 14px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* iMessage Chat Room (iOS Clean White Theme) */
    .chat-room { display: flex; flex-direction: column; background: #fff; height: 100%; position: relative; }
    .chat-nav {
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid #c6c6c8;
      background: #f7f7f7;
    }
    .chat-nav .back-btn { color: #007aff; }
    .chat-nav .chat-title { font-size: 16px; font-weight: 600; color: #000; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
    .chat-date { text-align: center; font-size: 11px; color: #8e8e93; margin: 16px 0 6px; font-weight: 500; }
    
    .bubble {
      max-width: 72%;
      padding: 9px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.38;
      word-break: break-word;
    }
    .bubble.other { background: #e9e9eb; align-self: flex-start; color: #000; border-bottom-left-radius: 4px; }
    .bubble.me { background: #007aff; align-self: flex-end; color: #fff; border-bottom-right-radius: 4px; }

    .chat-input-bar {
      padding: 10px 16px 24px 16px;
      background: #f7f7f7;
      border-top: 0.5px solid #c6c6c8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-input-box {
      flex: 1;
      background: #fff;
      border: 0.5px solid #c6c6c8;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 15px;
      color: #8e8e93;
    }
    .chat-send-btn {
      width: 30px; height: 30px;
      background: #007aff;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      color: #fff; font-weight: bold; font-size: 14px;
    }
  </style>
</head>
<body>

<div id="app-container">

  <div class="status-bar">

        </div>
      </div>

        <div class="icon-box bg-memo">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>

      </div>

          <svg viewBox="0 0 24 24"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        </div>
      </div>
      <div class="app-icon" onclick="openApp('photos')">
        <div class="icon-box bg-album">
